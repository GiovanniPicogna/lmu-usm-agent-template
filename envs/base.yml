# envs/base.yml
#
# Conda environment for LMU Astrophysics analysis projects.
# Provides all packages referenced in .github/copilot-instructions.md.
#
# Usage:
#   conda env create -f envs/base.yml
#   conda activate lmu-astro
#
# To update an existing environment:
#   conda env update -f envs/base.yml --prune
#
# Add project-specific packages in a project-level envs/project.yml
# that inherits from this file, or simply `conda install` into the env.

name: lmu-astro

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ─────────────────────────────────────────────────────────────────
  - python=3.11

  # ── Core scientific stack ──────────────────────────────────────────────────
  - numpy>=1.26
  - scipy>=1.12
  - matplotlib>=3.8
  - astropy>=6.0
  - astroquery>=0.4.7
  - h5py>=3.10

  # ── MCMC & posteriors ──────────────────────────────────────────────────────
  - emcee>=3.1
  - dynesty>=2.1          # nested sampling (retrievals, multi-modal posteriors)
  - corner>=2.2

  # ── Simulation analysis ────────────────────────────────────────────────────
  - yt>=4.3               # volumetric analysis of SPH/AMR snapshots (Magneticum, Gadget)
  - dustpy>=1.0           # 1-D dust coagulation/fragmentation (Birnstiel group)

  # ── Radiative transfer (disk post-processing) ──────────────────────────────
  # radmc3dPy and fargopy are pip-only; see pip block below.

  # ── X-ray spectral fitting (optional; comment out if not needed) ───────────
  # sherpa is best installed via conda-forge; PyXSPEC requires a local XSPEC build.
  - sherpa>=4.16

  # ── Data handling ──────────────────────────────────────────────────────────
  - regions>=0.8           # astropy regions (DS9 .reg files)
  - reproject>=0.13        # FITS image reprojection
  - photutils>=1.11        # aperture & source photometry

  # ── Development & reproducibility ─────────────────────────────────────────
  - tqdm>=4.66
  - click>=8.1
  - black>=24.0
  - flake8>=7.0
  - pre-commit>=3.7
  - pytest>=8.0
  - ipykernel                # Jupyter kernel for VS Code notebooks

  # ── MCP / agent tooling & simulation-specific (pip-only) ──────────────────
  - pip
  - pip:
    - ads>=0.12.6            # NASA ADS Python library (fallback when MCP unavailable)
    - uvx                    # needed to run MCP servers defined in settings.json
    - petitRADTRANS>=3.0     # atmospheric forward model & retrieval (Nortmann/Molaverdikhani group)
    - radmc3dPy>=0.41        # Python interface to RADMC-3D radiative transfer
    - fargopy>=0.3           # FARGO3D output reader (Picogna/Roatti group)
