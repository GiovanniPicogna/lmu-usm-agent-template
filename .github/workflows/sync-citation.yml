name: Sync CITATION.cff version

# Runs whenever CHANGELOG.md is updated on main.
# Parses the first versioned entry (e.g. "## [1.2.0] — 2026-05-20")
# and writes the version + date back into CITATION.cff.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  sync-citation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract version and date from CHANGELOG.md
        id: changelog
        run: |
          # First non-[Unreleased] versioned heading: ## [1.2.0] — 2026-05-20
          LINE=$(grep -m1 '^## \[[0-9]' CHANGELOG.md)
          VERSION=$(echo "$LINE" | grep -oP '\[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])')
          DATE=$(echo "$LINE"    | grep -oP '\d{4}-\d{2}-\d{2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE"       >> "$GITHUB_OUTPUT"
          echo "Parsed: version=$VERSION  date=$DATE"

      - name: Update CITATION.cff
        run: |
          sed -i \
            's/^version: ".*"/version: "${{ steps.changelog.outputs.version }}"/' \
            CITATION.cff
          sed -i \
            's/^date-released: ".*"/date-released: "${{ steps.changelog.outputs.date }}"/' \
            CITATION.cff

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CITATION.cff; then
            git add CITATION.cff
            git commit -m \
              "chore: sync CITATION.cff to v${{ steps.changelog.outputs.version }} [skip ci]"
            git push
          else
            echo "CITATION.cff already up to date — nothing to commit."
          fi
